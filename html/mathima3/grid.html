<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>

        header{
            background-color: aliceblue;
            padding:10px;
            display: flex;
            justify-content: center;
        }

        nav{
            display: grid;
            grid-template-columns: 33.33% 33.33% 33.33%;
            gap:10px;
        }

        .grid{
            display: grid;
        }

        .col{
            border:1px solid black;
            margin:10px;
        }

        .templte-50-50{
            grid-template-columns: 50% 50%;
        }

        .item{
            grid-column-start: 1;
            grid-column-end: 3;
        }

        @media (max-width:800px){
            .templte-50-50{
                grid-template-columns: 100%;
            }

            .item{
                grid-column-start: 1;
                grid-column-end: 2;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </nav>
    </header>
    <h2>Grid</h2>
    <div class="grid templte-50-50">
        <div class="col">
            <p>Col</p>
        </div>
        <div class="col">
            <p>Col</p>
        </div>
        <div class="col">
            <p>Col</p>
        </div>
        <div class="col">
            <p>Col</p>
        </div>
        <div class="col item">
            <p>Col</p>
        </div>
    </div>
</body>
</html>
