<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
        <style>

            body{
                height: 2000px;margin:0;
            }

            button{
                position: fixed;
                bottom:10px;
                right:10px;
            }

            .top-header{
                padding:20px;
                background-color: black;
                
            }

            header{
                background-color: silver;
                padding:10px;
                text-align: center;
                position: sticky;
                top:0;
            }

            header a{
                display: inline-block;
                margin:10px;
                padding:10px;
                color:black;
                text-decoration: none;
                font-size: 20px;
                font-family: sans-serif;
                
            }

            main{
                background: teal;
                position: static; /* default */
                position: relative;
            }

            main img{
                width: 100%;
            }

            .absolute1{
                top:10px;
                left:10px;
                position: absolute;
            }

            .absolute2{
                top:10px;
                right:10px;
                position: absolute;
            }

            .absolute3{
                bottom:10px;
                left:10px;
                position: absolute;
            }

            .absolute4{
                bottom:10px;
                right:10px;
                position: absolute;
            }

            .absolute5{
                top:50%;
                left:50%;
                position: absolute;
                transform: translate(-50%,-50%);
            }
        </style>
</head>
<body>
    <div class="top-header">

    </div>
    <header>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
        </nav>
    </header>
    <main>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5tW6qCPMi3Tn45xC1SQmQ7bV0lj_Ig7djZNPH4IR7xTCL_tAzRLnacVc&s=10" alt="">
        <p class="absolute1">TopLeft</p>
        <p class="absolute2">TopRight</p>
        <p class="absolute3">BottomLeft</p>
        <p class="absolute4">BottomRight</p>
        <p class="absolute5">Center</p>
    </main>

    <button>Top</button>
</body>
</html>
